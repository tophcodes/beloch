name: Release

# A pushed tag v<version> gets a GitHub release whose notes are the section of
# that version in CHANGELOG.md. The changelog is the source; the release copies
# it. Pushing the tag again (after a fix to the section) rewrites the notes.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Take the notes from the changelog
        run: scripts/changelog-section.sh "$GITHUB_REF_NAME" > notes.md
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi
