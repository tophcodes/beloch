name: Prose

# Reports the prose lint (.vale.ini, scripts/prose.sh) on every pull request.
# The job fails on an alert at level error, as `check` (check.yml) does. It
# adds the annotations and the counts, and its shell has no FLINT, so it
# reports long before `check` finishes. Warnings and suggestions are reported
# only. GitHub shows at most 10 annotations per level
# and step, so the job summary holds the full count.

on:
  pull_request:

permissions:
  contents: read

jobs:
  prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nixbuild/nix-quick-install-action@v35
      - name: Lint prose
        run: nix develop .#prose --command bash scripts/prose.sh --output=JSON --no-exit > "$RUNNER_TEMP/prose.json"
      - name: Report alerts
        run: |
          alerts="$RUNNER_TEMP/prose.json"
          jq -r '
            to_entries[] | .key as $file | .value[]
            | "::\(if .Severity == "error" then "error" elif .Severity == "warning" then "warning" else "notice" end) file=\($file),line=\(.Line),col=\(.Span[0]),title=\(.Check)::\(.Message | gsub("%"; "%25"))"
          ' "$alerts"
          {
            echo "## Prose lint"
            echo
            jq -r '[.[][]] | "\(length) alerts: \(map(select(.Severity == "error")) | length) errors, \(map(select(.Severity == "warning")) | length) warnings, \(map(select(.Severity == "suggestion")) | length) suggestions."' "$alerts"
            echo
            echo "| Rule | Alerts |"
            echo "|---|---|"
            jq -r '[.[][]] | group_by(.Check) | sort_by(-length) | .[] | "| `\(.[0].Check)` | \(length) |"' "$alerts"
            echo
            echo "| File | Alerts |"
            echo "|---|---|"
            jq -r 'to_entries | map(select(.value | length > 0)) | sort_by(-(.value | length)) | .[] | "| `\(.key)` | \(.value | length) |"' "$alerts"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail on errors
        run: jq -e '[.[][] | select(.Severity == "error")] | length == 0' "$RUNNER_TEMP/prose.json" > /dev/null
