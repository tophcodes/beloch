name: Commit subjects

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  subjects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the subjects of the new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: git log --no-merges --format=%s "$BASE..$HEAD" | scripts/check-commit-subjects.sh
