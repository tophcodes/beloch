name: Deploy docs site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'packages/render-2d/**'
      - 'lib/**'
      - 'bin/**'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Cache /nix/store
        # The FLINT-3.6.0 override isn't on cache.nixos.org, so it recompiles from
        # source on a cold store — this caches the built closure across runs.
        # (Self-hosted attic on the fleet is the longer-term substituter.)
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 2G
      - name: Build beloch (native)
        run: nix build .#beloch
      - name: Put beloch on PATH
        run: echo "$PWD/result/bin" >> "$GITHUB_PATH"
      # Regenerate the js_of_ocaml playground bundle from the current lib/web on
      # every deploy, so the committed artifact (site/public/beloch/beloch-eval.js)
      # can never drift from the evaluator. The FLINT-wasm qqbar module
      # (qqbar-wasm.js) stays a committed artifact — it's expensive to build and
      # only changes when web/qqbar_wasm.c does.
      - name: Regenerate js_of_ocaml eval bundle
        run: |
          nix develop --command dune build web/ --profile release
          cp _build/default/web/beloch_web.bc.js site/public/beloch/beloch-eval.js
      - uses: oven-sh/setup-bun@v2
      - name: Build site
        working-directory: site
        run: bun install && bun run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: pages deploy dist --project-name=beloch-docs --branch=main
