name: Deploy docs site

on:
  push:
    branches: [main]
    paths:
      - 'packages/www/**'
      - 'packages/render-2d/**'
      - 'packages/core/lib/**'
      - 'packages/core/bin/**'
      # The reference documents are symlinked into the site, and their figures
      # are generated from them by scripts/build-api-docs.sh.
      - 'spec/**'
      - 'scripts/**'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Cache /nix/store
        # The FLINT-3.6.0 override isn't on cache.nixos.org, so it recompiles from
        # source on a cold store — this caches the built closure across runs.
        # (Self-hosted attic on the fleet is the longer-term substituter.)
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 2G
      - name: Build beloch (native)
        run: nix build .#beloch
      - name: Put beloch on PATH
        run: echo "$PWD/result/bin" >> "$GITHUB_PATH"
      # odoc pages under packages/www/public/api and the register that the
      # spec pages read for their `.include` blocks and "Realized by" lines.
      - uses: oven-sh/setup-bun@v2
      - name: Build API docs and register
        run: nix develop --command scripts/build-api-docs.sh
      # Regenerate the js_of_ocaml playground bundle from the current
      # packages/core/lib/+packages/eval-web/ on every deploy, so the committed
      # artifact (packages/www/public/beloch/beloch-eval.js)
      # can never drift from the evaluator. The FLINT-wasm qqbar module
      # (qqbar-wasm.js) stays a committed artifact — it's expensive to build and
      # only changes when packages/eval-web/qqbar_wasm.c does.
      - name: Regenerate js_of_ocaml eval bundle
        run: |
          nix develop --command dune build packages/eval-web/ --profile release
          cp _build/default/packages/eval-web/beloch_web.bc.js packages/www/public/beloch/beloch-eval.js
      # The landing page's example programs are shipped as text and evaluated
      # only when a visitor clicks one, so nothing else here would notice them
      # going stale against the language.
      - name: Run site tests
        working-directory: packages/www
        run: bun install && bun test
      - name: Build site
        working-directory: packages/www
        run: bun run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/www
          command: pages deploy dist --project-name=beloch-docs --branch=main
