name: Build and test

# Runs `check` (scripts/check.sh) on every pull request that changes more
# than prose: the kernel suites against scripts/known-failures.txt, the bun
# suites and the prose lint at level error. A pull request that changes only
# Markdown no suite reads skips the job; prose.yml lints that Markdown at
# level error. The ruleset on main requires the job by its name,
# `build-and-test`, so the name stays as it is. A path filter on the trigger
# would leave the required check unreported and the pull request blocked; a
# job skipped by its `if` reports as passed. A push to main runs `check-all`,
# which includes `check`, in the deploy job (.github/workflows/deploy.yml).

on:
  pull_request:

permissions:
  contents: read

# A new push to the pull request makes the run for the previous one moot.
concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A Markdown file counts as prose unless a suite reads it: the kernel
      # and bun suites read spec/ and the guide under packages/, and a dune
      # file can name a decision as a test dependency.
      - name: Decide whether the pull request changes more than prose
        id: files
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          read_by_suites=$(grep -rhoE 'decisions/[^ )]+\.md' --include=dune packages | sort -u)
          code=false
          while read -r f; do
            case "$f" in
              spec/* | packages/*) code=true ;;
              *.md) if grep -qxF "$f" <<<"$read_by_suites"; then code=true; fi ;;
              *) code=true ;;
            esac
          done < <(git diff --name-only "$BASE...$HEAD")
          echo "code=$code" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: build-and-test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Single-user Nix, as in deploy.yml, so the store cache can be restored.
      - uses: nixbuild/nix-quick-install-action@v35
      - name: Restore /nix/store
        # The devshell needs the FLINT 3.6.0 override, which cache.nixos.org
        # does not have and which takes a long time to compile. The deploy job
        # saves its store, devshell included, under these keys on main, and a
        # pull request may restore caches of its base branch. The job only
        # restores: a store is about 3.5G, and one saved per pull request
        # would push main's out of the repository's 10G cache.
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-store-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'dune', 'dune-project', 'packages/core/**', 'packages/eval-web/**') }}
          restore-prefixes-first-match: nix-store-${{ runner.os }}-
          save: false
      - name: Check
        run: nix develop --command check
