# Prose lint for the Markdown in this repository and the comments of its
# OCaml sources. `prose` runs it.
#
# Prose is the fleet's own style: the rules from the prose guidelines that a
# pattern can decide. It lives in a private repository, and a copy of it sits
# under .vale/styles/Prose so that CI can read it. The copy holds the rules
# for English only, with the German Gedankenstrich rule as Prose.EnDash.
# Resync it by hand when the fleet's rules change.
#
# Slop (vale-llm-slop), proselint and write-good are pinned in flake.nix. The
# devshell links them into .vale/styles, where git ignores them.
#
# Spelling is American English. Terms of the project go in
# .vale/styles/config/vocabularies/Beloch/accept.txt, one per line; the
# vocabulary is the one place that lists them.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Beloch

# A .txt file is the comment prose that scripts/prose.sh masks out of an
# OCaml source.
[*.{md,mdx,txt}]
BasedOnStyles = Vale, Prose, Slop, proselint
# The vocabulary only teaches the spelling check; it does not prescribe a case.
Vale.Terms = NO
# The checks skip math ($...$ and $$...$$), which is LaTeX. A $ next to a
# backtick belongs to a code span, which Vale skips on its own.
TokenIgnores = (?:^|[^`$])(\$\$?[^\n$`]+\$\$?)
# Figure blocks (::: {.figure ...} ... :::) hold Beloch source.
BlockIgnores = (?sm)^(:::[^\n]*\{\.figure.*?^:::)$

# Prose.EmDash flags every em dash; Slop.EmDash only the third per paragraph.
Slop.EmDash = NO
Slop.Assistant = warning
Slop.Ceremony = warning
Slop.FillerConstruction = warning
Slop.ProcessNarration = warning
Slop.SelfHedging = warning
Slop.SelfReference = warning

# A discriminant is a term of algebra here, and needs no plainer word.
proselint.Needless = NO

# write-good as a whole flags passive voice and every "it is", which a
# specification needs. These four rules catch real faults.
write-good.ThereIs = YES
write-good.So = YES
write-good.Illusions = YES
# "several" and "usually" stand where a count or a bound belongs.
write-good.Weasel = suggestion

# Two comments with only code between them sit next to each other in the
# masked copy, and Vale reports a word that ends one comment and starts the
# next as a repetition.
[*.txt]
Vale.Repetition = NO
write-good.Illusions = NO
